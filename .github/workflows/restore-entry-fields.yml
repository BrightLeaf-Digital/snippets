name: Restore Directory Entry Fields (one-off)

# Recovery for the 2026-08-31 array_merge field-shift, which wrote every entry's values into
# the wrong field IDs. Writes the pre-damage values back from a JSON export taken beforehand.
#
# Manual only, and temporary: delete this workflow, .github/scripts/restore-entry-fields.php
# and .github/scripts/restore-entry-fields.json once the directory is confirmed good.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "restore" to write, or "dry-run" to preview without writing'
        required: true
        type: string

concurrency:
  group: snippet-directory-sync # Never run alongside the sync.
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore
        env:
          GF_WEBHOOK_URL: ${{ secrets.GF_WEBHOOK_URL }}
          GF_CONSUMER_KEY: ${{ secrets.GF_CONSUMER_KEY }}
          GF_CONSUMER_SECRET: ${{ secrets.GF_CONSUMER_SECRET }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$CONFIRM" in
            restore)
              php .github/scripts/restore-entry-fields.php
              ;;
            dry-run)
              php .github/scripts/restore-entry-fields.php --dry-run
              ;;
            *)
              echo "::error::Type \"restore\" to write, or \"dry-run\" to preview. Got: $CONFIRM"
              exit 1
              ;;
          esac
